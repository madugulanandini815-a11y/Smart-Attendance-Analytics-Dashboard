<!DOCTYPE html>
<html>

<head>

    <title>Add Department</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Add Department</h3>

</div>

<div class="card-body">

<form method="POST">

<label class="fw-bold">

Department Name

</label>

<input
type="text"
name="department_name"
class="form-control"
required>

<br>

<label class="fw-bold">

HOD Name

</label>

<input
type="text"
name="hod_name"
class="form-control"
required>

<br>

<label class="fw-bold">

Department Block

</label>

<input
type="text"
name="department_block"
class="form-control"
required>

<br>

<button class="btn btn-success">

Save Department

</button>

<a href="/departments" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
