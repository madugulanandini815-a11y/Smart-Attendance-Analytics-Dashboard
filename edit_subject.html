<!DOCTYPE html>
<html>

<head>

<title>Edit Subject</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Subject</h3>

</div>

<div class="card-body">

<form method="POST">

<label>Department</label>

<input
type="text"
name="department"
class="form-control"
value="{{ subject[3] }}"
required>

<br>

<label>Subject Name</label>

<input
type="text"
name="subject_name"
class="form-control"
value="{{ subject[1] }}"
required>

<br>

<label>Semester</label>

<input
type="number"
name="semester"
class="form-control"
value="{{ subject[2] }}"
required>

<br>

<button class="btn btn-success">

Update

</button>

<a href="/subjects" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
