<!DOCTYPE html>
<html>

<head>

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Student</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Roll Number</label>

<input
type="text"
name="roll_no"
class="form-control"
value="{{student[1]}}"
required>

</div>

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{student[2]}}"
required>

</div>

<div class="mb-3">

<label>Department</label>

<input
type="text"
name="department"
class="form-control"
value="{{student[3]}}"
required>

</div>

<div class="mb-3">

<label>Semester</label>

<input
type="number"
name="semester"
class="form-control"
value="{{student[4]}}"
required>

</div>

<div class="mb-3">

<label>Section</label>

<input
type="text"
name="section"
class="form-control"
value="{{student[5]}}"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{student[6]}}"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
value="{{student[7]}}"
required>

</div>

<button
class="btn btn-warning">

Update Student

</button>

<a
href="/students"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
