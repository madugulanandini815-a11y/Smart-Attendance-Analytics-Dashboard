<!DOCTYPE html>
<html>

<head>

    <title>Edit Department</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .card{
            max-width:650px;
            margin:auto;
            margin-top:60px;
            border:none;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
        }

        .card-header{
            border-radius:15px 15px 0 0 !important;
        }

        .form-control{
            border-radius:8px;
        }

        .btn{
            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-header bg-warning text-dark">

<h3 class="mb-0">

✏ Edit Department

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="fw-bold">

🏫 Department Name

</label>

<input
type="text"
name="department_name"
class="form-control"
value="{{ department[1] }}"
required>

</div>

<div class="mb-3">

<label class="fw-bold">

👨‍🏫 HOD Name

</label>

<input
type="text"
name="hod_name"
class="form-control"
value="{{ department[2] }}"
required>

</div>

<div class="mb-3">

<label class="fw-bold">

🏢 Department Block

</label>

<input
type="text"
name="department_block"
class="form-control"
value="{{ department[3] }}"
required>

</div>

<div class="text-center">

<button
type="submit"
class="btn btn-success">

💾 Update Department

</button>

<a
href="/departments"
class="btn btn-secondary">

← Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
