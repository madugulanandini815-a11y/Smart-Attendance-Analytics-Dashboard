<!DOCTYPE html>
<html>

<head>

<title>Edit Attendance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h2>Edit Attendance</h2>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Student</label>

<select name="student_id" class="form-control">

{% for s in students %}

<option value="{{ s[0] }}"
{% if s[0]==attendance[1] %}selected{% endif %}>
{{ s[1] }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Subject</label>

<select name="subject_id" class="form-control">

{% for s in subjects %}

<option value="{{ s[0] }}"
{% if s[0]==attendance[2] %}selected{% endif %}>
{{ s[1] }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Date</label>

<input
type="date"
name="attendance_date"
class="form-control"
value="{{ attendance[3] }}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select name="status" class="form-control">

<option value="Present"
{% if attendance[4]=="Present" %}selected{% endif %}>
Present
</option>

<option value="Absent"
{% if attendance[4]=="Absent" %}selected{% endif %}>
Absent
</option>

</select>

</div>

<button class="btn btn-warning">
Update Attendance
</button>

<a href="/attendance" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

</body>

</html>
