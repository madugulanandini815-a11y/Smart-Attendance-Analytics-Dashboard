<!DOCTYPE html>
<html>

<head>

<title>Add Subject</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Add Subject</h3>

</div>

<div class="card-body">

<form method="POST">

<label>Department</label>

<select
name="department"
class="form-control"
required>

<option value="">Select Department</option>

<option>CSE</option>

<option>ELC</option>

<option>EEE</option>

<option>CYS</option>

<option>Mechanical</option>

<option>Civil</option>

<option>Chemical</option>

<option>AI & DS</option>

<option>IT</option>

</select>

<br>

<label>Subject Name</label>

<input
type="text"
name="subject_name"
class="form-control"
required>

<br>

<label>Semester</label>

<input
type="number"
name="semester"
class="form-control"
required>

<br>

<button class="btn btn-success">

Save Subject

</button>

<a href="/subjects" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
