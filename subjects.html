<!DOCTYPE html>
<html>

<head>

    <title>Subjects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2>📚 Subject Management</h2>

<p class="text-muted">
Manage Department-wise Subjects
</p>

</div>

<div>

<a href="/dashboard" class="btn btn-secondary">
🏠 Dashboard
</a>

<a href="/add_subject" class="btn btn-success">
➕ Add Subject
</a>

</div>

</div>

<table class="table table-bordered table-hover text-center">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Department</th>

<th>Subject Name</th>

<th>Semester</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

{% for s in subjects %}

<tr>

<td>{{ s[0] }}</td>

<td>{{ s[3] }}</td>

<td>{{ s[1] }}</td>

<td>{{ s[2] }}</td>

<td>

<a href="/edit_subject/{{ s[0] }}" class="btn btn-warning btn-sm">

Edit

</a>

<a href="/delete_subject/{{ s[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Subject?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
