<!DOCTYPE html>
<html>

<head>

    <title>{{ department }} Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .header{
            background:linear-gradient(90deg,#0d6efd,#4e73df);
            color:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:25px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

        table{
            background:white;
        }

        thead{
            background:#0d6efd;
            color:white;
        }

        tbody tr:hover{
            background:#eef5ff;
            transition:.3s;
        }

    </style>

</head>

<body>

<div class="container mt-4">

<div class="header d-flex justify-content-between align-items-center">

<div>

<h2>

👨‍🎓 {{ department }} Students

</h2>

<p class="mb-0">

Department Wise Student List

</p>

</div>

<div>

<a href="/departments" class="btn btn-light">

← Back

</a>

</div>

</div>

<div class="card">

<div class="card-body">

<table class="table table-bordered table-hover text-center align-middle">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Roll No</th>

<th>Name</th>

<th>Semester</th>

<th>Section</th>

<th>Email</th>

<th>Phone</th>

<th>Profile</th>

</tr>

</thead>

<tbody>

{% for s in students %}

<tr>

<td>{{ s[0] }}</td>

<td>{{ s[1] }}</td>

<td>{{ s[2] }}</td>

<td>{{ s[4] }}</td>

<td>{{ s[5] }}</td>

<td>{{ s[6] }}</td>

<td>{{ s[7] }}</td>

<td>

<a href="/student_profile/{{ s[0] }}"
class="btn btn-info btn-sm">

👤 View Profile

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>

</html>
