<!DOCTYPE html>
<html>

<head>

<title>Mark Attendance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0px 5px 20px rgba(0,0,0,.2);
}

.card-header{
    border-radius:15px 15px 0 0 !important;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-success text-white">

<h2>📅 Mark Attendance</h2>

<p class="mb-0">

Smart Attendance Analytics System

</p>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="fw-bold">

🏫 Department

</label>

<select
id="department"
name="department"
class="form-control"
onchange="filterData()"
required>

<option value="">Select Department</option>

<option>CSE</option>

<option>ELC</option>

<option>EEE</option>

<option>CYS</option>

<option>Mechanical</option>

<option>Civil</option>

<option>Chemical</option>

<option>AI & DS</option>

<option>IT</option>

</select>

</div>


<div class="mb-3">

<label class="fw-bold">

👨‍🎓 Student

</label>

<select
id="student"
name="student_id"
class="form-control"
required>

<option value="">

Select Student

</option>

{% for s in students %}

<option
value="{{ s[0] }}"
data-dept="{{ s[2] }}">

{{ s[1] }}

</option>

{% endfor %}

</select>

</div>


<div class="mb-3">

<label class="fw-bold">

📚 Subject

</label>

<select
id="subject"
name="subject_id"
class="form-control"
required>

<option value="">

Select Subject

</option>

{% for s in subjects %}

<option
value="{{ s[0] }}"
data-dept="{{ s[2] }}">

{{ s[1] }}

</option>

{% endfor %}

</select>

</div>


<div class="mb-3">

<label class="fw-bold">

📅 Attendance Date

</label>

<input
type="date"
name="attendance_date"
class="form-control"
required>

</div>


<div class="mb-3">

<label class="fw-bold">

📌 Status

</label>

<select
name="status"
class="form-control">

<option value="Present">

✅ Present

</option>

<option value="Absent">

❌ Absent

</option>

</select>

</div>


<div class="text-center">

<button class="btn btn-success">

💾 Save Attendance

</button>

<a href="/attendance"
class="btn btn-secondary">

← Cancel

</a>

</div>

</form>

</div>

</div>

</div>


<script>

function filterData(){

    let dept = document.getElementById("department").value;

    let student = document.getElementById("student");

    let subject = document.getElementById("subject");

    student.selectedIndex = 0;

    subject.selectedIndex = 0;

    document.querySelectorAll("#student option").forEach(function(option){

        if(option.value=="") return;

        option.hidden = option.dataset.dept !== dept;

    });

    document.querySelectorAll("#subject option").forEach(function(option){

        if(option.value=="") return;

        option.hidden = option.dataset.dept !== dept;

    });

}

</script>

</body>

</html>
