<!DOCTYPE html>
<html>

<head>

    <title>Edit Faculty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:Arial,Helvetica,sans-serif;
        }

        .card{
            max-width:700px;
            margin:auto;
            margin-top:50px;
            border:none;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
        }

        .card-header{
            background:linear-gradient(90deg,#ffc107,#ffb300);
            color:#000;
            border-radius:15px 15px 0 0 !important;
        }

        .form-control{
            border-radius:8px;
        }

        .btn{
            border-radius:8px;
            padding:10px 20px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-header">

<h3 class="mb-0">

👩‍🏫 Edit Faculty

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="fw-bold">

Faculty Name

</label>

<input
type="text"
name="faculty_name"
class="form-control"
value="{{ faculty[1] }}"
required>

</div>

<div class="mb-3">

<label class="fw-bold">

Subject

</label>

<input
type="text"
name="subject"
class="form-control"
value="{{ faculty[2] }}"
required>

</div>

<div class="mb-3">

<label class="fw-bold">

Email

</label>

<input
type="email"
name="email"
class="form-control"
value="{{ faculty[3] }}"
required>

</div>

<div class="mb-3">

<label class="fw-bold">

Phone Number

</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ faculty[4] }}"
required>

</div>

<div class="text-center">

<button
type="submit"
class="btn btn-warning">

💾 Update Faculty

</button>

<a
href="/faculty"
class="btn btn-secondary">

← Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
